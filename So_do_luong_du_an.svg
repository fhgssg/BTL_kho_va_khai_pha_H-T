<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1840" viewBox="0 0 1400 1840" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ hoạt động dự án Online Retail Data Lakehouse</title>
  <desc id="desc">Luồng từ dữ liệu nguồn qua MinIO raw, làm sạch, staging, curated, PostgreSQL, kiểm thử, OLAP và khai phá đến dashboard.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 32px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 2.5; rx: 18; }
      .main { fill: #eff6ff; stroke: #2563eb; }
      .lake { fill: #ecfdf5; stroke: #059669; }
      .warehouse { fill: #f5f3ff; stroke: #7c3aed; }
      .analysis { fill: #fff7ed; stroke: #ea580c; }
      .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2.5; }
      .error { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 14; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .label { font: 700 21px "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .detail { font: 16px "Segoe UI", Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .small { font: 14px "Segoe UI", Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .branch { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1400" height="1840" fill="#ffffff"/>
  <text x="700" y="55" class="title" text-anchor="middle">LUỒNG THỰC HIỆN DỰ ÁN BÁN LẺ TRỰC TUYẾN</text>
  <text x="700" y="86" class="subtitle" text-anchor="middle">MinIO Lakehouse → PostgreSQL DWH → Phân tích → Dashboard</text>

  <!-- Main path -->
  <rect x="430" y="125" width="540" height="105" class="box main"/>
  <text x="700" y="166" class="label">1. Dữ liệu nguồn</text>
  <text x="700" y="198" class="detail">data/raw/data.csv · 541.909 dòng, 8 cột</text>

  <path d="M700 230 L700 270" class="edge"/>
  <rect x="430" y="275" width="540" height="105" class="box lake"/>
  <text x="700" y="316" class="label">2. MinIO — tầng raw</text>
  <text x="700" y="348" class="detail">raw/online_retail/data.csv · lưu bản gốc trước xử lý</text>

  <path d="M700 380 L700 420" class="edge"/>
  <rect x="430" y="425" width="540" height="125" class="box main"/>
  <text x="700" y="466" class="label">3. EDA và làm sạch</text>
  <text x="700" y="498" class="detail">Đọc lại raw từ MinIO · kiểm tra schema, thiếu, trùng, bất thường</text>
  <text x="700" y="526" class="small">Loại trùng / hóa đơn hủy / số lượng hoặc giá không hợp lệ</text>

  <path d="M430 490 L290 490" class="edge-dashed"/>
  <rect x="45" y="420" width="245" height="145" class="box note"/>
  <text x="167" y="458" class="label" style="font-size:17px">Đầu ra audit</text>
  <text x="167" y="489" class="small">data_cleaned.csv</text>
  <text x="167" y="515" class="small">data_rejected.csv</text>
  <text x="167" y="541" class="small">data_cleaning_audit.csv</text>

  <path d="M700 550 L700 600" class="edge"/>
  <rect x="430" y="605" width="540" height="100" class="box lake"/>
  <text x="700" y="646" class="label">4. MinIO — tầng staging</text>
  <text x="700" y="678" class="detail">Dữ liệu sạch dạng Parquet (Snappy)</text>

  <path d="M700 705 L700 755" class="edge"/>
  <rect x="430" y="760" width="540" height="120" class="box lake"/>
  <text x="700" y="801" class="label">5. MinIO — tầng curated</text>
  <text x="700" y="833" class="detail">DuckDB đọc staging, tạo Star Schema dạng Parquet</text>
  <text x="700" y="859" class="small">Dim_Date · Dim_Customer · Dim_Product · Dim_Location · Fact_Sales</text>

  <path d="M700 880 L700 930" class="edge"/>
  <rect x="430" y="935" width="540" height="115" class="box warehouse"/>
  <text x="700" y="977" class="label">6. PostgreSQL — Data Warehouse</text>
  <text x="700" y="1010" class="detail">Đọc lại curated · nạp Star Schema trong transaction</text>
  <text x="700" y="1036" class="small">Lưu ý: ETL hiện TRUNCATE bảng trước khi nạp lại</text>

  <path d="M700 1050 L700 1100" class="edge"/>
  <rect x="430" y="1105" width="540" height="100" class="box main"/>
  <text x="700" y="1146" class="label">7. Kiểm thử và đối soát DWH</text>
  <text x="700" y="1178" class="detail">Số dòng · doanh thu · khóa ngoại · NULL · quy tắc nghiệp vụ</text>

  <path d="M700 1205 L700 1250" class="edge"/>
  <polygon points="700,1250 835,1320 700,1390 565,1320" class="decision"/>
  <text x="700" y="1315" class="label" style="font-size:19px">Tất cả kiểm tra</text>
  <text x="700" y="1343" class="label" style="font-size:19px">đều PASS?</text>

  <!-- Failure branch -->
  <path d="M835 1320 L1030 1320" class="edge"/>
  <text x="895" y="1305" class="branch">Không</text>
  <rect x="1035" y="1265" width="320" height="110" class="error"/>
  <text x="1195" y="1307" class="label" style="font-size:18px">Dừng phân tích</text>
  <text x="1195" y="1338" class="detail">Xem report · sửa lỗi · chạy lại</text>
  <path d="M1195 1265 L1195 235 L980 235" class="edge-dashed"/>
  <text x="1210" y="820" class="small" transform="rotate(-90 1210 820)">Quay lại chạy pipeline sau khi xử lý lỗi</text>

  <!-- Success branch and analytics -->
  <path d="M700 1390 L700 1430 L430 1430 L430 1470" class="edge"/>
  <path d="M700 1430 L970 1430 L970 1470" class="edge"/>
  <text x="716" y="1420" class="branch">Có</text>

  <rect x="170" y="1475" width="520" height="125" class="box analysis"/>
  <text x="430" y="1518" class="label">8a. Phân tích OLAP</text>
  <text x="430" y="1551" class="detail">8 đầu ra: thời gian, địa lý, SKU, giờ, AOV, khách</text>
  <text x="430" y="1578" class="small">scripts/04_run_olap_queries.py</text>

  <rect x="710" y="1475" width="520" height="125" class="box analysis"/>
  <text x="970" y="1518" class="label">8b. Khai phá dữ liệu</text>
  <text x="970" y="1551" class="detail">RFM + K-Means · Apriori / luật mua kèm</text>
  <text x="970" y="1578" class="small">scripts/05_data_mining.py · kết quả lưu trong outputs/</text>

  <path d="M430 1600 L430 1640 L700 1640 L700 1670" class="edge"/>
  <path d="M970 1600 L970 1640 L700 1640" class="edge"/>

  <rect x="430" y="1675" width="540" height="100" class="box warehouse"/>
  <text x="700" y="1717" class="label">9. Dashboard Streamlit</text>
  <text x="700" y="1748" class="detail">Kết hợp PostgreSQL DWH và kết quả khai phá trong outputs/</text>

  <text x="700" y="1815" class="small">Luồng chính: dữ liệu nguồn → Lakehouse → DWH → kiểm thử → phân tích → dashboard</text>
</svg>
